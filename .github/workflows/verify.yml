name: verify

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j 2

    - name: Run unit tests
      run: ctest --test-dir build -j 2 --output-on-failure
